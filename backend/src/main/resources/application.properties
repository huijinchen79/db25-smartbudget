# SmartBudget – Spring Boot configuration
# ================================================================
# TICKET-F045 (Day 5, Sprint 4) — Verify Application Properties
# ================================================================
# Every property below is annotated with its effect. Read top-to-bottom
# before opening the H2 console, then verify the running app matches:
#   1. http://localhost:8080/h2-console   (JDBC URL: jdbc:h2:mem:smartbudget)
#   2. curl http://localhost:8080/api/categories   -> JSON list
# ----------------------------------------------------------------

spring.application.name=smartbudget

# ---- H2 In-Memory DB (dev) ----
# In-memory H2 named "smartbudget". DB_CLOSE_DELAY=-1 keeps it alive for the
# whole JVM (otherwise it dies when the last connection closes and Spring
# would re-create an empty schema mid-run). Data is lost on app restart.
spring.datasource.url=jdbc:h2:mem:smartbudget;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- H2 Console -> http://localhost:8080/h2-console ----
# Exposes the browser UI. Log in with JDBC URL: jdbc:h2:mem:smartbudget,
# User: sa, Password: (blank). Overwrite the default jdbc:h2:~/test.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
# ddl-auto=create-drop: Hibernate creates tables on startup from @Entity
# classes and drops them on shutdown. Convenient for dev; NEVER use in
# production — switch to Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=create-drop
# Log every SQL statement Hibernate executes (great for seeing what
# Spring Data query derivation generates).
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Seed data ----
# Runs data.sql on startup. defer-datasource-initialization=true waits
# for Hibernate's create-drop to finish before data.sql runs — otherwise
# the INSERTs would hit non-existent tables.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---- Actuator (health/info only, no sensitive endpoints exposed) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---- Server ----
server.port=8080