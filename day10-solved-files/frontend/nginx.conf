# ============================================================
# TICKET-F109 (Day 10, Sprint 9) — nginx Configuration for React SPA
# ============================================================
#
# WHAT: nginx (pronounced "engine-X") is a high-performance web server.
#       This configuration file tells nginx how to handle incoming HTTP requests.
#       It does THREE things:
#         1. Serves React's static files (HTML, JS, CSS, images)
#         2. Proxies /api/* and /actuator/* requests to the Spring Boot backend container
#         3. Handles React Router URLs with try_files (SPA fallback)
#
# WHY:  Without this config, two things break:
#
#       PROBLEM 1 — API calls fail:
#         React runs on nginx (port 80). Backend runs on port 8080.
#         Without proxy, nginx says "I don't know /api/categories" → 404.
#         WITH proxy, nginx forwards /api/* to the backend → success.
#
#       PROBLEM 2 — Page refresh gives 404:
#         React Router URLs like /transactions only exist in the JavaScript.
#         Without try_files, nginx looks for a FILE called "transactions" → 404.
#         WITH try_files, nginx falls back to /index.html → React Router picks up.
#
# VISUAL: How requests flow through nginx:
#
#       GET /                      → serve /usr/share/nginx/html/index.html
#       GET /transactions          → no such file → try_files → index.html
#       GET /assets/index-abc.js   → serve the hashed JS file directly (cached 30d)
#       GET /api/categories        → proxy_pass http://backend:8080/api/categories
#       GET /actuator/health       → proxy_pass http://backend:8080/actuator/health
# ============================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Static assets — hashed filenames from Vite, safe to cache aggressively.
    # ------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ico|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # SPA fallback — every unknown path renders index.html so React Router
    # can take over. This is the single line that makes /transactions
    # survive a hard-refresh (F5).
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # API proxy — forwards to the Spring Boot container.
    # "backend" is the docker-compose service name; Docker's internal DNS
    # resolves it to the backend container's IP inside the compose network.
    # This ALSO kills CORS: the browser sees a single origin (nginx).
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Spring Boot health/metrics endpoints, also proxied.
    location /actuator/ {
        proxy_pass http://backend:8080;
    }

    # ------------------------------------------------------------------
    # gzip — compress text responses on the fly. Saves bandwidth,
    # noticeably faster first-paint on slow connections.
    # ------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;
}
