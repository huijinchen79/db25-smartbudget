# ============================================================
# TICKET-F117 (Day 10, Sprint 9) — Production Spring profile
# ============================================================
#
# Loaded when SPRING_PROFILES_ACTIVE=prod is set (docker-compose does this).
# Overrides the H2 dev defaults from application.properties.
#
# Precedence (later beats earlier):
#   1. application.properties           (base — H2 dev defaults)
#   2. application-prod.properties      (this file — PostgreSQL overrides)
#   3. OS environment variables         (SPRING_DATASOURCE_URL → spring.datasource.url)
#   4. Command-line args                (--server.port=9090)
# ============================================================

# --- Datasource ---------------------------------------------------------
# The ${…:default} syntax reads an env var but falls back for local runs.
# In docker-compose these three env vars are always injected.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartbudget}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sb_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sb_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ----------------------------------------------------
# update  = evolve schema, never drop data (dev used create-drop — dangerous in prod).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- Do NOT reseed prod data --------------------------------------------
# Dev uses spring.sql.init.mode=always to reset seed data each boot.
# Prod uses never — real user data must not be overwritten.
spring.sql.init.mode=never

# --- Kill the H2 console in prod ----------------------------------------
# Leaving it enabled on a public host is a giant security hole (remote SQL shell).
spring.h2.console.enabled=false
